<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Frontispiece placeholder">
  <!-- A warm editorial placeholder in the archive's palette.
       Not a real portrait — the caption below it says as much.
       Parchment ground, oxblood duotone, grain, a soft figure silhouette. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe7d8"/>
      <stop offset="1" stop-color="#e7dcc8"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="72%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a2c1f" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3a2f"/>
      <stop offset="1" stop-color="#5e201a"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#paper)"/>

  <!-- a soft, abstracted figure: shoulders + head, off-center for editorial framing -->
  <g transform="translate(402 430)" opacity="0.9">
    <ellipse cx="0" cy="-150" rx="118" ry="150" fill="url(#fig)"/>
    <path d="M -260 470 C -260 200, -150 120, 0 120 C 150 120, 260 200, 260 470 Z" fill="url(#fig)"/>
  </g>

  <!-- warm light gracing one side -->
  <path d="M0 0 L800 0 L800 1000 L260 1000 C 120 720, 120 300, 80 0 Z" fill="#f7f1e6" opacity="0.5"/>

  <rect width="800" height="1000" fill="url(#vignette)"/>
  <rect width="800" height="1000" filter="url(#grain)" opacity="0.5"/>

  <!-- hairline frame -->
  <rect x="22" y="22" width="756" height="956" fill="none" stroke="#7a2a23" stroke-opacity="0.35" stroke-width="1"/>

  <!-- corner mark -->
  <text x="44" y="62" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#7a2a23" opacity="0.7">A.S.</text>
  <text x="756" y="968" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#7a2a23" opacity="0.6">frontispiece · to come</text>
</svg>
